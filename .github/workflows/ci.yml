name: Aeitron MCP Server CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build TypeScript
        run: npm run build

      - name: Run Test Suite (27 passing tests)
        run: npm test

      - name: Verify OpenAPI Contract
        run: npx --yes @redocly/cli lint chatgpt-actions-openapi.yaml

      - name: Verify Docker Container Build
        run: docker build -t aeitron-mcp-server:ci .
